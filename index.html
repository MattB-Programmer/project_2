<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Character Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Rick and Morty Character Explorer</h1>
        <p>Explore characters from the Rick and Morty universe!</p>
    </header>

    <main>
        <div class="controls">
            <button id="fetch-btn">Fetch Characters</button>

            <div class="search">
                <input type="text" id="search-input" placeholder="Search for a character...">
                <button id="search-btn">Search</button>
            </div>
        </div>

        <p id="message"></p>

        <div id="character-container"></div>
    </main>

    <footer>
        <p>&copy; 2026 Rick and Morty Character Explorer</p>
    </footer>

</body>
</html>
